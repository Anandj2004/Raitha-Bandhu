<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriConnect - Organic Fertilizers</title>
  <style>
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      background: #f4f9f5; 
      margin: 0; 
      padding: 0; 
      color: #333;
      background-image: linear-gradient(to bottom, #f4f9f5, #e6f1e8);
    }
    .main { 
      padding: 20px; 
      max-width: 1100px; 
      margin: auto; 
    }
    h1 { 
      color: #2E8B57; 
      text-align: center;
      margin-bottom: 1.5rem;
      font-size: 2.5rem;
      margin-top: 20px;
      text-shadow: 1px 1px 2px rgba(46, 139, 87, 0.3);
    }
    .search-box { 
      margin: 25px 0; 
      text-align: center; 
    }
    .search-box input { 
      width: 80%; 
      max-width: 400px; 
      padding: 12px 20px; 
      border: 2px solid #3CB371; 
      border-radius: 25px; 
      font-size: 16px; 
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      background: #f0fff0;
    }
    .grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); 
      gap: 25px; 
      margin-bottom: 40px;
    }
    .card { 
      background: white; 
      padding: 20px; 
      border-radius: 12px; 
      box-shadow: 0 6px 15px rgba(0,0,0,0.1); 
      text-align: center;
      transition: transform 0.3s ease;
      border: 1px solid #c9e8d6;
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.15);
    }
    .card img { 
      width: 120px; 
      height: 120px; 
      object-fit: contain;
      border-radius: 10px;
      background: #f8f8f8;
      padding: 10px;
    }
    .fertilizer-name { 
      font-size: 20px; 
      font-weight: bold; 
      margin: 15px 0 5px;
      color: #2E8B57;
    }
    .price { 
      color: #3CB371; 
      font-size: 18px; 
      margin-bottom: 15px;
      font-weight: 600;
    }
    .qty-controls { 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      gap: 12px; 
      margin: 15px 0; 
    }
    .qty-controls button { 
      padding: 8px 15px; 
      border: none; 
      background: #2E8B57; 
      color: white; 
      border-radius: 5px; 
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }
    .qty-controls button:hover {
      background: #3CB371;
    }
    .add-btn { 
      background: #3CB371; 
      color: white; 
      padding: 12px 20px; 
      border: none; 
      border-radius: 8px; 
      cursor: pointer; 
      font-size: 16px;
      font-weight: 600;
      width: 100%;
      transition: background 0.3s;
    }
    .add-btn:hover { 
      background: #2E8B57; 
    }
    .cart-notification {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #3CB371;
      color: white;
      padding: 15px 20px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      display: none;
      z-index: 1000;
    }
  </style>
</head>
<body>

    <h1>Organic Fertilizers</h1>
    <div class="search-box">

    <div class="grid" id="fertilizerGrid"></div>
  </main>

    let cart = JSON.parse(localStorage.getItem("cart")) || {};

    function saveCart() {
      localStorage.setItem("cart", JSON.stringify(cart));
    }

    function showNotification(message) {
      const notification = document.getElementById("cartNotification");
      notification.textContent = message;
      notification.style.display = "block";
      
      setTimeout(() => {
        notification.style.display = "none";
      }, 3000);
    }



let tempQty = {}; // temporary qty tracker

function increaseQty(id) {
  if (!tempQty[id]) tempQty[id] = 1;
  else tempQty[id]++;
  document.getElementById(`qty-${id}`).textContent = tempQty[id];
}

function decreaseQty(id) {
  if (tempQty[id] && tempQty[id] > 0) {
    tempQty[id]--;
    document.getElementById(`qty-${id}`).textContent = tempQty[id];
  }
}

function addToCart(id) {
  const qty = tempQty[id] || 0;

  if (qty === 0) {
    alert("⚠ Please select quantity before adding to cart!");
    return;
  }

  // Add to cart only here
  if (!cart[id]) cart[id] = qty;
  else cart[id] += qty;

  saveCart();
  tempQty[id] = 0; // reset temp after adding
  document.getElementById(`qty-${id}`).textContent = 0;

  localStorage.setItem("cartMessage", "✅ " + fertilizers.find(f => f.id === id).name + " added to cart!");
  alert("✅ Added to cart! Go to cart page to see.");
}


    function renderFertilizers(filter = "") {
      const grid = document.getElementById("fertilizerGrid");
      grid.innerHTML = "";
      fertilizers
        .filter(fertilizer => fertilizer.name.toLowerCase().includes(filter.toLowerCase()))
        .forEach(fertilizer => {
          const qty = cart[fertilizer.id] || 0;
          grid.innerHTML += `
            <section class="card" data-id="${fertilizer.id}">
              <img src="${fertilizer.img}" alt="${fertilizer.name}">
              <div class="fertilizer-name">${fertilizer.name}</div>
              <div class="price">₹${fertilizer.price} <small>${fertilizer.unit}</small></div>
              <div class="qty-controls">
                <button onclick="decreaseQty(${fertilizer.id})">-</button>
                <span id="qty-${fertilizer.id}">${qty}</span>
                <button onclick="increaseQty(${fertilizer.id})">+</button>
              </div>
              <button class="add-btn" onclick="addToCart(${fertilizer.id})">Add to Cart</button>
            </section>
          `;
        });
    }

    // Initial render
    renderFertilizers();

    // Search functionality
    document.getElementById("searchInput").addEventListener("input", (e) => {
      renderFertilizers(e.target.value);
    });
  </script>
