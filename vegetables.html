  <style>

    .qty-controls button { padding: 5px 10px; border: none; background: #2d5a27; color: white; border-radius: 5px; cursor: pointer; }
    .add-btn { background: #4a7c42; color: white; padding: 10px 15px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
    .add-btn:hover { background: #2d5a27; }

    let cart = JSON.parse(localStorage.getItem("cart")) || {};

    function saveCart() {
      localStorage.setItem("cart", JSON.stringify(cart));
    }



    

   let tempQty = {}; // temporary qty tracker

function increaseQty(id) {
  if (!tempQty[id]) tempQty[id] = 1;
  else tempQty[id]++;
  document.getElementById(`qty-${id}`).textContent = tempQty[id];
}

function decreaseQty(id) {
  if (tempQty[id] && tempQty[id] > 0) {
    tempQty[id]--;
    document.getElementById(`qty-${id}`).textContent = tempQty[id];
  }
}

function addToCart(id) {
  const qty = tempQty[id] || 0;

  if (qty === 0) {
    alert("⚠ Please select quantity before adding to cart!");
    return;
  }

  // Add to cart only here
  if (!cart[id]) cart[id] = qty;
  else cart[id] += qty;

  saveCart();
  tempQty[id] = 0; // reset temp after adding
  document.getElementById(`qty-${id}`).textContent = 0;

  localStorage.setItem("cartMessage", "✅ " + vegetables.find(f => f.id === id).name + " added to cart!");
  alert("✅ Added to cart! Go to cart page to see.");
}



    function renderVegetables(filter = "") {
      const grid = document.getElementById("vegetableGrid");
      grid.innerHTML = "";
      vegetables
        .filter(vegetable => vegetable.name.toLowerCase().includes(filter.toLowerCase()))
        .forEach(vegetable => {
          const qty = cart[vegetable.id] || 0;
          grid.innerHTML += `
            <section class="card" data-id="${vegetable.id}">
              <img src="${vegetable.img}" alt="${vegetable.name}">
              <div class="fruit-name">${vegetable.name}</div>
              <div class="price">₹${vegetable.price} <small>${vegetable.unit}</small></div>
              <div class="qty-controls">
                <button onclick="decreaseQty(${vegetable.id})">-</button>
                <span id="qty-${vegetable.id}">${qty}</span>
                <button onclick="increaseQty(${vegetable.id})">+</button>
              </div>
              <button class="add-btn" onclick="addToCart(${vegetable.id})">Add to Cart</button>
            </section>
          `;
        });
    }

    // Initial render
    renderVegetables();

    // Search functionality
    document.getElementById("searchInput").addEventListener("input", (e) => {
      renderVegetables(e.target.value);
    });
  </script>

</body>
</html>
