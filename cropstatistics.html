<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crop Statistics</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 0;
      color: #333;
    }

    header {
      background: #4a7c42;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    .stats-cards {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      margin: 20px;
      gap: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      width: 220px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
    }

    .card h2 {
      margin: 10px 0;
      font-size: 22px;
      color: #4a7c42;
    }

    .card p {
      font-size: 18px;
      margin: 5px 0;
    }

    .table-container {
      max-width: 1000px;
      margin: 0 auto 40px auto;
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    table th, table td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
    }

    table th {
      background: #4a7c42;
      color: white;
    }

    table tr:nth-child(even) {
      background: #f9f9f9;
    }

  </style>
</head>
<body>

  <header>
    <h1>Crop Statistics Dashboard</h1>
  </header>

  <!-- ===== Cards for Key Metrics ===== -->
  <div class="stats-cards">
    <div class="card">
      <h2>Total Crops Sold</h2>
      <p id="totalSold">0</p>
    </div>
    <div class="card">
      <h2>Total Remaining</h2>
      <p id="totalRemaining">0</p>
    </div>
    <div class="card">
      <h2>Total Revenue</h2>
      <p id="totalRevenue">₹0</p>
    </div>
  </div>

  <!-- ===== Detailed Table ===== -->
  <div class="table-container">
    <h2>Crop Details</h2>
    <table>
      <thead>
        <tr>
          <th>Crop Name</th>
          <th>Sold Quantity</th>
          <th>Remaining Quantity</th>
          <th>Price per Unit</th>
          <th>Total Revenue</th>
        </tr>
      </thead>
      <tbody id="cropTableBody">
        <!-- Data will be inserted here via JS -->
      </tbody>
    </table>
  </div>

  <script>
    // Sample crop data
    const crops = [
      { name: "Wheat", sold: 120, remaining: 80, price: 50 },
      { name: "Rice", sold: 200, remaining: 50, price: 60 },
      { name: "Corn", sold: 150, remaining: 100, price: 40 },
      { name: "Tomato", sold: 80, remaining: 40, price: 30 },
      { name: "Potato", sold: 100, remaining: 60, price: 25 }
    ];

    // Render table and calculate totals
    let totalSold = 0;
    let totalRemaining = 0;
    let totalRevenue = 0;

    const tableBody = document.getElementById('cropTableBody');

    crops.forEach(crop => {
      const revenue = crop.sold * crop.price;
      totalSold += crop.sold;
      totalRemaining += crop.remaining;
      totalRevenue += revenue;

      const row = document.createElement('tr');
      row.innerHTML = `
        <td>${crop.name}</td>
        <td>${crop.sold}</td>
        <td>${crop.remaining}</td>
        <td>₹${crop.price}</td>
        <td>₹${revenue}</td>
      `;
      tableBody.appendChild(row);
    });

    // Update cards
    document.getElementById('totalSold').innerText = totalSold;
    document.getElementById('totalRemaining').innerText = totalRemaining;
    document.getElementById('totalRevenue').innerText = `₹${totalRevenue}`;
  </script>

</body>
</html>
